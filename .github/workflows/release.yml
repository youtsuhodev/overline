name: Release installer

# Builds the Inno Setup installer on version tags (v1.2.3, V1.2.3, ...)
# and publishes it in a draft GitHub Release.

on:
  push:
    tags:
      - 'v*'
      - 'V*'

permissions:
  contents: write # gh release create/upload

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install Inno Setup 6
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        env:
          TAG_VERSION: ${{ github.ref_name }}
        run: ./build-installer.ps1 -Version ($env:TAG_VERSION -replace '^[vV]', '')

      - name: Publish draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $version = $tag -replace '^[vV]', ''
          $installer = "artifacts/installer/Overline-Setup-$version.exe"
          if (-not (Test-Path $installer)) {
            throw "Installer introuvable: $installer"
          }
          gh release create $tag --draft --title "Overline $version" --generate-notes $installer